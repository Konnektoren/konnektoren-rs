<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="Konnektoren Rust workspace: GitHub repository, Cargo docs, and project documentation."
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/firacode/6.2.0/fira_code.min.css"
    />
    <link data-trunk rel="rust" />
    <title>Konnektoren RS</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0f1411;
        color: #e8f1ea;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: stretch;
        justify-content: center;
        background:
          radial-gradient(circle at 20% 10%, rgba(70, 126, 92, 0.2), transparent 28rem),
          linear-gradient(135deg, #0f1411 0%, #18221c 48%, #0b1114 100%);
      }

      pre {
        font-family: inherit;
        font-size: clamp(13px, 1.6vw, 17px);
        line-height: 1.18;
        margin: 0;
      }

      canvas,
      pre {
        width: 100%;
      }
    </style>
  </head>
  <body></body>
</html>
