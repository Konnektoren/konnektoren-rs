[package]
name = "konnektoren-page"
edition = { workspace = true }
version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "Ratzilla-powered GitHub Pages index for konnektoren-rs"

[dependencies]
ratzilla = { workspace = true }
# ratzilla enables ratatui's "layout-cache" feature, which needs a critical-section
# impl registered. Without this, the wasm binary emits raw imports
# (`_critical_section_1_0_acquire`/`_release`) from module "env" that the browser
# can't resolve. The "std" feature auto-registers a std::sync::Mutex-based impl.
critical-section = { version = "1", features = ["std"] }
